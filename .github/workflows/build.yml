name: Build VzSync Release

# Trigger the workflow on pushes to main/master and allow manual runs
# from the Actions tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository contents.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install JDK 17, required by AGP 8.13 and Kotlin 2.3.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Gradle and Android build caches to speed up subsequent builds.
      # The cache key hashes Gradle configuration files so the cache is
      # invalidated when dependencies or plugins change.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Restore the release keystore from the base64-encoded secret into
      # the path expected by build.gradle.kts.
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks

      # Make the Gradle wrapper executable on the runner.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compile the release variant. Signing credentials are injected via
      # environment variables and read by the signingConfigs block in
      # app/build.gradle.kts.
      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          VZSIGN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VZSIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VZSIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Upload the signed APK as a downloadable artifact.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VzSync-release-apk
          path: app/build/outputs/apk/release/app-release.apk